version: 0.1
updated: 2026-04-18
purpose: >
  Canonical registry for vocabulary integration, contextual lore bridges,
  and layered Easter eggs across the Somatic Canticles manuscript,
  Serpentine app surfaces, and synchronocities-blog.

principles:
  - narrative_sovereignty
  - context_not_marketing
  - optional_depth_not_forced_diversion
  - uplift_through_authorship_not_consolation
  - explicit_links_live_outside_core_narrative

surfaces:
  manuscript_body:
    allow:
      - vocabulary_signal
      - symbolic_echo
      - structural_easter_egg
      - lore_foreshadow
    avoid:
      - direct_url
      - article_title_drop
      - promotional_language
  chapter_title_or_epigraph:
    allow:
      - acrostic
      - symbolic_recurrence
      - discoverable_phrase
    avoid:
      - obvious_linking_language
  backmatter_or_glossary:
    allow:
      - explicit_post_reference
      - direct_url
      - decoder_note
      - companion_reading
    avoid:
      - link_dump
  webapp_context_surface:
    allow:
      - explicit_post_reference
      - direct_url
      - lore_panel
      - decoder_module
      - companion_reading
    avoid:
      - forced_redirect
      - interruptive_modal
  mobile_context_surface:
    allow:
      - explicit_post_reference
      - direct_url
      - decoder_tab
      - lore_drawer
    avoid:
      - interruptive_prompt

